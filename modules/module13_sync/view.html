<div class="card" style="padding: 24px;">
    <h2><i class="fas fa-cloud-upload-alt"></i> Đồng bộ dữ liệu đám mây (Supabase)</h2>
    <p style="color: var(--text-secondary); margin-bottom: 20px;">
        Quản lý tài khoản và đồng bộ an toàn dữ liệu cá nhân của bạn lên hệ thống đám mây Supabase.
    </p>

    <!-- QUAN TRỌNG: Phải có khung này thì app.js mới vẽ được nút đăng nhập Google -->
    <div id="user-auth-status"></div>

    <hr style="margin: 24px 0; border: 0; border-top: 1px solid var(--border-color, #ddd);">

    <h3>Sao lưu / Khôi phục thủ công (JSON)</h3>
    <div style="margin-top: 12px; display: flex; gap: 10px; margin-bottom: 16px;">
        <button id="btn-export-json" class="btn btn-primary"><i class="fas fa-download"></i> Xuất JSON</button>
        <button id="btn-import-json" class="btn btn-success"><i class="fas fa-upload"></i> Nhập JSON</button>
    </div>
    <textarea id="json-input-area" placeholder="Dán dữ liệu JSON ở đây để import..." style="width: 100%; height: 120px; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color, #ddd); background: var(--bg-card, #fff); color: var(--text-main);"></textarea>
</div>
