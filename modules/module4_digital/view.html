<div class="card">
    <div class="card-header">
        <h2 class="card-title"><i class="fas fa-laptop-code"></i> Chuyển đổi số - Theo Bộ GD&ĐT</h2>
    </div>
    <form id="digital-form">
        <div class="grid-2">
            <div class="form-group">
                <label>LMS (Hệ thống quản lý học tập)</label>
                <select id="d_lms" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>Google Classroom</label>
                <select id="d_classroom" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>Microsoft Teams</label>
                <select id="d_teams" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>AI (ChatGPT, Gemini, Copilot)</label>
                <select id="d_ai" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>Canva</label>
                <select id="d_canva" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>NotebookLM</label>
                <select id="d_notebooklm" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>Website cá nhân</label>
                <select id="d_website" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>GitHub</label>
                <select id="d_github" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>QR Code trong dạy học</label>
                <select id="d_qr" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>Học liệu số</label>
                <select id="d_learning" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>STEM</label>
                <select id="d_stem" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
            <div class="form-group">
                <label>IoT</label>
                <select id="d_iot" class="form-control">
                    <option value="1">Có</option><option value="0">Không</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu đánh giá CĐS</button>
    </form>
    <div style="margin-top:20px;">
        <h4>Điểm chuyển đổi số: <span id="digital-score" style="color: var(--m365-blue);">0</span>/12</h4>
    </div>
</div>
